services:
  - type: web
    name: agentpay-guard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentpay-guard-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PAYMENTS_ENABLED
        value: 'false'
      - key: CAPTURE_ENABLED
        value: 'false'
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: SESSION_CREATION_LIMIT_PER_MINUTE
        value: '30'
      - key: GEMINI_REQUESTS_PER_HOUR
        value: '30'

databases:
  - name: agentpay-guard-db
    plan: free
