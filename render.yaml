services:
  - type: web
    name: agentpay-guard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PAYMENTS_ENABLED
        value: 'false'
      - key: CAPTURE_ENABLED
        value: 'false'
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: SESSION_CREATION_LIMIT_PER_MINUTE
        value: '20'
      - key: CLIENT_SESSION_LIMIT_PER_MINUTE
        value: '5'
      - key: CLIENT_PROPOSAL_LIMIT_PER_MINUTE
        value: '10'
      - key: GEMINI_REQUESTS_PER_HOUR
        value: '20'
      - key: DATABASE_POOL_SIZE
        value: '3'
      - key: DATABASE_MAX_OVERFLOW
        value: '2'
